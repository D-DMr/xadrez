document.addEventListener('firebase-online-match',e=>{const d=e.detail,color=d.whiteUid==d.uid?'w':'b';G.srch=0;G.opp=null;G.mode=2;G.tc=d.timeControl;G.online={roomId:d.roomId,uid:d.uid,color,whiteUid:d.whiteUid,blackUid:d.blackUid,whiteName:d.whiteName,blackName:d.blackName,opponentName:color=='w'?d.blackName:d.whiteName,ply:0,sending:false,finished:false};Object.assign(G,{s:fen(START),hs:[],sans:[],sel:-1,tg:[],last:null,pm:null,tm:[TC[G.tc][0],TC[G.tc][0]],flag:'',resign:'',rec:0,rv:-1,flip:color=='b'?1:0});onlineMessage='';render()});

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, getRedirectResult, onAuthStateChanged, signInWithCredential, signInWithRedirect, signOut } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, addDoc, collection, deleteDoc, doc, getDoc, getDocs, limit, onSnapshot, orderBy, query, runTransaction, serverTimestamp, setDoc, where } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyB0YYPdPXyvthU1autG611fsjfoSgxDZk0',authDomain:'xadrez-3a613.firebaseapp.com',projectId:'xadrez-3a613',storageBucket:'xadrez-3a613.firebasestorage.app',messagingSenderId:'424719795420',appId:'1:424719795420:web:6fb57386b78b51d97aa019'});
const auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const send=(name,detail)=>document.dispatchEvent(new CustomEvent(name,{detail}));
const onlineRooms=collection(db,'online_rooms');
let onlineSearchId=0,onlineSearchRoom=null,onlineRoomUnsubscribe=null,onlineMovesUnsubscribe=null,onlineRoomId=null;
const onlineStatus=(status,message)=>send('firebase-online-status',{status,message});
const displayName=user=>(user.displayName||user.email?.split('@')[0]||'Jogador').replace(/[^\w \-À-ÿ.]/g,'').trim().slice(0,24)||'Jogador';
function stopOnlineListeners(){onlineRoomUnsubscribe?.();onlineMovesUnsubscribe?.();onlineRoomUnsubscribe=null;onlineMovesUnsubscribe=null;onlineRoomId=null}
function activateOnlineRoom(roomRef,room,user){
  if(room.status=='finished'){send('firebase-online-ended',{roomId:roomRef.id,endedBy:room.endedBy});return}
  if(room.status!='active'||onlineRoomId==roomRef.id)return;
  onlineSearchId++;
  stopOnlineListeners();
  onlineRoomId=roomRef.id;
  send('firebase-online-match',{roomId:roomRef.id,uid:user.uid,whiteUid:room.whiteUid,blackUid:room.blackUid,whiteName:room.whiteName,blackName:room.blackName,timeControl:room.timeControl});
  let nextPly=0;
  onlineRoomUnsubscribe=onSnapshot(roomRef,snapshot=>{
    if(!snapshot.exists()){send('firebase-online-error',{message:'A sala da partida deixou de existir.'});return}
    const updated=snapshot.data();
    if(updated.status=='finished')send('firebase-online-ended',{roomId:roomRef.id,endedBy:updated.endedBy});
  },error=>send('firebase-online-error',{message:'Ligação à partida perdida: '+error.message}));
  onlineMovesUnsubscribe=onSnapshot(query(collection(roomRef,'moves'),orderBy('ply')),snapshot=>{
    for(const moveDoc of snapshot.docs){
      const move=moveDoc.data();
      if(move.ply<nextPly)continue;
      if(move.ply!==nextPly)break;
      nextPly++;
      send('firebase-online-move',{roomId:roomRef.id,ply:move.ply,from:move.from,to:move.to,promotion:move.promotion,remainingTime:move.remainingTime,createdAt:move.createdAt});
    }
  },error=>send('firebase-online-error',{message:'Não foi possível sincronizar os lances: '+error.message}));
}
async function findOnlineMatch(timeControl){
  const user=auth.currentUser;
  if(!user)throw new Error('Inicia sessão com Google antes de procurar uma partida.');
  if(!['0','1','3','10','30'].includes(timeControl))throw new Error('Escolhe um controlo de tempo válido.');
  await window.firebaseOnline.cancel(false);
  const searchId=++onlineSearchId;
  const myRoom=doc(onlineRooms);
  onlineSearchRoom=myRoom;
  await setDoc(myRoom,{hostUid:user.uid,hostName:displayName(user),status:'waiting',timeControl:timeControl=='0'?'10':timeControl,createdAt:serverTimestamp()});
  onlineRoomUnsubscribe=onSnapshot(myRoom,snapshot=>{
    if(snapshot.exists())activateOnlineRoom(snapshot.ref,snapshot.data(),user);
  },error=>{if(onlineRoomId)send('firebase-online-error',{message:'Ligação perdida durante a partida: '+error.message});else{cancelOnlineSearch().catch(cleanupError=>console.error('Could not clean up online matchmaking room:',cleanupError));onlineStatus('error','Ligação perdida durante a procura: '+error.message)}});
  onlineStatus('searching','A procurar outro jogador…');
  while(searchId==onlineSearchId){
    const waiting=await getDocs(query(onlineRooms,where('status','==','waiting'),limit(25)));
    for(const candidate of waiting.docs){
      if(searchId!=onlineSearchId)break;
      if(candidate.id==myRoom.id)continue;
      const room=candidate.data();
      if(Date.now()-(room.createdAt?.toMillis?.()||Date.now())>120000){
        try{await deleteDoc(candidate.ref)}catch(error){if(error.code!='permission-denied')throw error}
        continue;
      }
      if(room.hostUid==user.uid)continue;
      const whiteUid=Math.random()<.5?user.uid:room.hostUid;
      try{
        const matched=await runTransaction(db,async transaction=>{
          const mine=await transaction.get(myRoom);
          if(mine.exists()&&mine.data().status=='active')return{ref:myRoom,data:mine.data()};
          if(!mine.exists()||mine.data().status!='waiting')return null;
          const opponent=await transaction.get(candidate.ref);
          if(!opponent.exists()||opponent.data().status!='waiting'||opponent.data().hostUid==user.uid)return null;
          const host=opponent.data(),guestName=displayName(user),whiteName=whiteUid==user.uid?guestName:host.hostName,blackName=whiteUid==user.uid?host.hostName:guestName;
          const activeRoom={...host,status:'active',guestUid:user.uid,guestName,whiteUid,blackUid,whiteName,blackName,ply:0,turnUid:whiteUid,lastMoveId:'',updatedAt:serverTimestamp()};
          transaction.update(candidate.ref,activeRoom);
          transaction.delete(myRoom);
          return{ref:candidate.ref,data:activeRoom};
        });
        if(matched){onlineSearchRoom=null;activateOnlineRoom(matched.ref,matched.data,user);return}
      }catch(error){if(error.code!='aborted'&&error.code!='failed-precondition')throw error}
    }
    await new Promise(resolve=>setTimeout(resolve,2500));
  }
}
async function cancelOnlineSearch(){
  onlineSearchId++;
  const room=onlineSearchRoom;
  onlineSearchRoom=null;
  onlineRoomUnsubscribe?.();
  onlineRoomUnsubscribe=null;
  if(room){const snapshot=await getDoc(room);if(snapshot.exists()&&snapshot.data().status=='waiting')await deleteDoc(room)}
}
window.firebaseOnline={
  start:async timeControl=>{try{return await findOnlineMatch(timeControl)}catch(error){try{await cancelOnlineSearch()}catch(cleanupError){console.error('Could not clean up online matchmaking room:',cleanupError)}throw error}},
  cancel:async notify=>{await cancelOnlineSearch();if(notify!==false)onlineStatus('cancelled','Procura cancelada.')},
  close:()=>{onlineSearchId++;stopOnlineListeners();onlineSearchRoom=null},
  sendMove:async({from,to,promotion,ply,remainingTime})=>{
    const user=auth.currentUser,roomId=onlineRoomId;
    if(!user||!roomId)throw new Error('A partida online já não está ligada.');
    const roomRef=doc(onlineRooms,roomId),moveRef=doc(collection(roomRef,'moves'));
    await runTransaction(db,async transaction=>{
      const snapshot=await transaction.get(roomRef);
      if(!snapshot.exists())throw new Error('A sala da partida deixou de existir.');
      const room=snapshot.data();
      if(room.status!='active'||room.turnUid!=user.uid||room.ply!=ply)throw new Error('Já não é a tua vez ou a partida foi atualizada.');
      transaction.set(moveRef,{uid:user.uid,ply,from,to,promotion,remainingTime,createdAt:serverTimestamp()});
      transaction.update(roomRef,{ply:ply+1,turnUid:room.whiteUid==user.uid?room.blackUid:room.whiteUid,lastMoveId:moveRef.id,updatedAt:serverTimestamp()});
    });
  },
  resign:async()=>{
    const user=auth.currentUser,roomId=onlineRoomId;
    if(!user||!roomId)throw new Error('A partida online já não está ligada.');
    await runTransaction(db,async transaction=>{
      const roomRef=doc(onlineRooms,roomId),snapshot=await transaction.get(roomRef);
      if(!snapshot.exists()||snapshot.data().status!='active')throw new Error('A partida já terminou.');
      const room=snapshot.data(),winnerUid=room.whiteUid==user.uid?room.blackUid:room.whiteUid;
      if(room.whiteUid!=user.uid&&room.blackUid!=user.uid)throw new Error('Não fazes parte desta partida.');
      transaction.update(roomRef,{status:'finished',result:'resign',endedBy:user.uid,winnerUid,endedAt:serverTimestamp()});
    });
  }
};
onAuthStateChanged(auth,user=>send('firebase-auth-state',{ready:true,user:user?{uid:user.uid,email:user.email,displayName:user.displayName}:null}),error=>{send('firebase-auth-state',{ready:true,user:null});send('firebase-auth-message',{message:'Falha ao verificar a sessão: '+error.message})});
const recordLogin=async user=>{
  try{
    if(!user.email)throw new Error('A conta Google não disponibilizou um email.');
    await addDoc(collection(db,'login_events'),{uid:user.uid,email:user.email,loggedAt:serverTimestamp()});
    send('firebase-auth-message',{message:'Sessão iniciada; entrada registada de forma privada.'})
  }catch(error){send('firebase-auth-message',{message:'A sessão foi iniciada, mas não foi possível guardar a entrada no Firestore: '+error.message})}
};
getRedirectResult(auth).then(result=>{if(result?.user)return recordLogin(result.user)}).catch(error=>send('firebase-auth-message',{message:'Não foi possível concluir o início de sessão: '+error.message}));
window.addEventListener('firebase-google-signin',async()=>{
  try{
    if(window.desktopAuth){
      const {idToken}=await window.desktopAuth.signIn();
      const result=await signInWithCredential(auth,GoogleAuthProvider.credential(idToken));
      await recordLogin(result.user);
      return
    }
    await signInWithRedirect(auth,provider)
  }
  catch(error){
    const message=error.code=='auth/operation-not-allowed'?'Ativa o fornecedor Google em Firebase Console > Authentication > Sign-in method.':error.code=='auth/unauthorized-domain'?'Autoriza xadrez-3a613.firebaseapp.com em Firebase Console > Authentication > Settings > Authorized domains.':'Não foi possível iniciar sessão: '+error.message;
    send('firebase-auth-message',{message});return
  }
});
window.addEventListener('firebase-google-signout',async()=>{
  try{await signOut(auth);send('firebase-auth-message',{message:'Sessão terminada.'})}
  catch(error){send('firebase-auth-message',{message:'Não foi possível terminar a sessão: '+error.message})}
});
</script></body></html>
