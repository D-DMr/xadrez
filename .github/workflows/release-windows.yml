name: Windows portable app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: xadrez
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xadrez/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set app version from tag
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version

      - name: Configure optional Windows code signing
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing.p12'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "CSC_LINK=$certificatePath" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Configure Google Desktop OAuth client
        env:
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_SECRET)) {
            throw 'Add the GOOGLE_DESKTOP_CLIENT_SECRET Actions secret before creating a release.'
          }
          $oauthClient = @{
            client_id = '424719795420-37c0n990t8o9orb9486rrefp0n7p2gb7.apps.googleusercontent.com'
            client_secret = $env:GOOGLE_DESKTOP_CLIENT_SECRET
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'desktop/oauth-client.json'),
            $oauthClient,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build portable Windows app
        run: npm run build:win

      - name: Publish portable app
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: xadrez/dist/Xadrez-Total.exe
